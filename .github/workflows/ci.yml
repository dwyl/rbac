name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7  # github.com/actions/checkout
      - name: Set up Elixir
        uses: erlef/setup-beam@v1  # github.com/erlef/setup-beam
        with:
          elixir-version: "1.18.4" # Define the elixir version [required]
          otp-version: "28.0.1"    # Define the OTP version [required]
      - name: Restore dependencies cache
        uses: actions/cache@v6     # github.com/actions/cache
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Run Tests
        run: mix coveralls.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIX_ENV: test
          AUTH_API_KEY: 2cfxNbDLPhaRqsUBu1Hprp8Sd4yMng3u4d86m6SLjDYK82dm32W/2cfxNauZ2k54MwvfPVgvqLf7jjB38vsdCVimhLCgnXwiXRhj6ch/authdemo.fly.dev
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7 # github.com/codecov/codecov-action